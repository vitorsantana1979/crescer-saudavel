# Credenciais vêm do arquivo .env (não versionado) na raiz do repositório.
# Copie .env.example para .env e preencha; veja docs/SEGREDOS_ROTACAO.md.
services:
  api:
    build:
      context: ./backend
      target: prod
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=${DATABASE_SERVER:?Defina DATABASE_SERVER no .env (veja .env.example)};Database=${DATABASE_NAME:-crescer};User Id=${DATABASE_USER:?Defina DATABASE_USER no .env (veja .env.example)};Password=${DATABASE_PASSWORD:?Defina DATABASE_PASSWORD no .env (veja .env.example)};TrustServerCertificate=True;
      - Jwt__Key=${JWT_KEY:?Defina JWT_KEY no .env (veja .env.example)}
      - OpenAI__ApiKey=${OPENAI_API_KEY:-}
      - Seed__SuperAdminPassword=${SEED_SUPERADMIN_PASSWORD:-}
    networks: [webnet]
    expose:           # expõe só na rede docker
      - "5280"
    restart: unless-stopped
    healthcheck:
      test: ["CMD","wget","-qO-","http://localhost:5280/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ./frontend
      target: prod
    networks: [webnet]
    expose:
      - "80"
    restart: unless-stopped

  caddy:
    image: caddy:2.8
    networks: [webnet]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

networks:
  webnet:

volumes:
  caddy_data:
  caddy_config:
