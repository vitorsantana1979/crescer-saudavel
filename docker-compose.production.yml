# Produção. Credenciais vêm do arquivo .env (não versionado) ao lado deste compose.
# Copie .env.example para .env no servidor e preencha; veja docs/SEGREDOS_ROTACAO.md.

services:
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    volumes:
      - ml-models:/models
    environment:
      - DATABASE_SERVER=${DATABASE_SERVER:?Defina DATABASE_SERVER no .env (veja .env.example)}
      - DATABASE_NAME=${DATABASE_NAME:-crescer}
      - DATABASE_USER=${DATABASE_USER:?Defina DATABASE_USER no .env (veja .env.example)}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:?Defina DATABASE_PASSWORD no .env (veja .env.example)}
      - DATABASE_DRIVER=ODBC Driver 18 for SQL Server
      - DATABASE_TRUST_CERTIFICATE=True
      - MODEL_PATH=${MODEL_PATH:-/models}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - app-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=${ASPNETCORE_URLS:-http://0.0.0.0:5280}
      - ConnectionStrings__DefaultConnection=Server=${DATABASE_SERVER:?Defina DATABASE_SERVER no .env (veja .env.example)};Database=${DATABASE_NAME:-crescer};User Id=${DATABASE_USER:?Defina DATABASE_USER no .env (veja .env.example)};Password=${DATABASE_PASSWORD:?Defina DATABASE_PASSWORD no .env (veja .env.example)};TrustServerCertificate=True;
      - Jwt__Key=${JWT_KEY:?Defina JWT_KEY no .env (veja .env.example)}
      - MLService__BaseUrl=http://ml-service:8000
      - OpenAI__ApiKey=${OPENAI_API_KEY:-}
      - OpenAI__Model=gpt-4
      - OpenAI__MaxTokens=1500
      - Seed__SuperAdminPassword=${SEED_SUPERADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:5280:5280"
    networks:
      - app-network
    depends_on:
      - ml-service
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
      args:
        - VITE_API_URL=${VITE_API_URL}
    ports:
      - "127.0.0.1:3000:80"
    networks:
      - app-network
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  ml-models:

networks:
  app-network:
    driver: bridge
